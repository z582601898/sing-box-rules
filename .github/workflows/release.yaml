name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
 
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      
      - name: Build geosite
        id: build_site
        run: |
          cd sing-geosite
          go run -v .

      - name: Build geoip
        id: build_ip
        run: |
          cd sing-geoip
          go run -v .
      
      - name: Release rule sets
        if: steps.build_site.outputs.skip != 'true' || steps.build_ip.outputs.skip != 'true'
        run: .github/release-rule-set.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current time
        id: time
        run: echo "time=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
      
      - name: Create and Upload Release Assets
        if: steps.build_site.outputs.skip != 'true' || steps.build_ip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.time }}
          name: Release ${{ steps.time.outputs.time }}
          draft: false
          prerelease: false
          files: |
            ./sing-geosite/geosite.db
            ./sing-geoip/geoip.db
            ./sing-geoip/geoip-cn.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
